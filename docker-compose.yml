version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: web_almacen_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    networks:
      - web_almacen_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: web_almacen_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - web_almacen_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: web_almacen_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: web_almacen
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: almacen_user
      MYSQL_PASSWORD: almacen_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web_almacen_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: web_almacen_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8081:80"
    networks:
      - web_almacen_network
    depends_on:
      - db

networks:
  web_almacen_network:
    driver: bridge

volumes:
  db_data:
    driver: local
